<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>

    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('https://raw.githubusercontent.com/Starsinns/JaneDoeWebsite/refs/heads/main/images/Spectre.webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
        text-align: center;
    }
    
    .message {
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) infinite;
    }
    
    h1 {
        font-size: 3rem;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
    }
    
    h2 {
        font-size: 1.1rem;
        font-weight: 400;
        opacity: 0.85;
    }
    
    @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    </style>

</head>
<body>
    <div class="message">
        <h1>404 - Page Not Found</h1>
        <h2>What you seek is nowhere near the light.</h2>
    </div>

  <script>
    const message = document.querySelector('.message');
 
    setTimeout(() => {
      message.style.animation = 'none';
 
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }, 5000);
  </script>

</body>
</html>
